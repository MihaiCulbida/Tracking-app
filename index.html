<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#233D4D">
  <title>Tracker</title>
  <link rel="icon" type="image" href="run.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map" aria-label="Map showing your route"></div>

  <section class="panel" aria-label="Controls and stats">
    <p id="status" class="status" role="status">Press Start to begin tracking.</p>

    <dl class="stats">
      <div><dt>Distance</dt><dd id="stat-dist">0.00 km</dd></div>
      <div><dt>Time</dt><dd id="stat-time">00:00:00</dd></div>
      <div><dt>Speed</dt><dd id="stat-speed">0.0 km/h</dd></div>
    </dl>

    <div class="actions">
      <button id="btn-toggle" class="primary" type="button">Start</button>
      <button id="btn-finish" type="button">Finish</button>
      <button id="btn-follow" type="button" aria-pressed="true">Follow me</button>
      <button id="btn-image" type="button">Save image</button>
    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script src="src/script.js"></script>
</body>
</html>
